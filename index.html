<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>豆豆樂樂 · 智能任務檢查表 · 雲端同步</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #fdf7f0;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 1500px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .sync-banner {
            max-width: 1500px;
            width: 100%;
            background: #e8f5e9;
            border-radius: 20px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            border: 2px solid #a5d6a7;
            box-shadow: 0 4px 0 #81c784, 0 5px 12px -4px rgba(0, 0, 0, 0.1);
        }
        .sync-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #2e7d32;
            flex-wrap: wrap;
        }
        .sync-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
            animation: pulse 2s infinite;
            flex-shrink: 0;
        }
        .sync-dot.offline { background: #f44336; animation: none; }
        .sync-dot.syncing { background: #ff9800; animation: pulse 0.6s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }
        .sync-info { font-size: 0.8rem; color: #558b55; font-weight: 500; }
        .sync-btn {
            background: #c8e6c9;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            color: #2e7d32;
            cursor: pointer;
            font-size: 0.8rem;
            border: 1px solid #a5d6a7;
            transition: 0.1s;
        }
        .sync-btn:hover { background: #a5d6a7; }
        .sync-btn:active { transform: translateY(1px); }

        .holiday-banner {
            max-width: 1500px;
            width: 100%;
            background: #fff3e0;
            border-radius: 24px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            border: 2px solid #ffcc80;
            box-shadow: 0 5px 0 #e0b070, 0 6px 14px -4px rgba(90, 60, 30, 0.15);
        }
        .holiday-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #6b4d2e;
            cursor: pointer;
            user-select: none;
            flex-wrap: wrap;
        }
        .holiday-label input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: #e68a2e;
            cursor: pointer;
            transform: scale(1.1);
            flex-shrink: 0;
        }
        .holiday-status {
            font-size: 0.85rem;
            background: #ffe0b2;
            padding: 5px 14px;
            border-radius: 30px;
            color: #7a4f1e;
            font-weight: 600;
            white-space: nowrap;
        }
        .holiday-status.active { background: #c8e6c9; color: #1f4f1f; }

        .child-card {
            flex: 1 1 560px;
            background: #ffffffd9;
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 20px 18px;
            box-shadow: 0 16px 28px -8px rgba(90, 60, 30, 0.2), 0 4px 10px rgba(0, 0, 0, 0.04);
            border: 2px solid #ffe3cc;
            transition: all 0.2s;
        }
        .child-card.doudou { border-top: 6px solid #ffb882; }
        .child-card.lele { border-top: 6px solid #a7c7e7; }

        .child-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .child-name {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .doudou .child-name { color: #b45f2b; }
        .lele .child-name { color: #2c5f8a; }
        .child-avatar { font-size: 2.4rem; }

        .date-display {
            font-size: 0.78rem;
            color: #7a5a42;
            background: #f5ede5;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            margin-left: auto;
            white-space: nowrap;
        }
        .day-selector {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-left: auto;
        }
        .day-selector button {
            border: none;
            background: #f2ebe5;
            border-radius: 24px;
            padding: 6px 12px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #5e4b3a;
            cursor: pointer;
            box-shadow: 0 2px 0 #cbb9aa;
            transition: all 0.06s;
            border: 1px solid #e2d5c9;
            min-width: 34px;
        }
        .day-selector button.active {
            background: #b48b6a;
            color: white;
            box-shadow: 0 1px 0 #6e4f36;
            transform: translateY(1px);
        }
        .day-selector button:active {
            transform: translateY(3px);
            box-shadow: 0 0px 0 #cbb9aa;
        }
        .holiday-mode .day-selector button { opacity: 0.5; }
        .holiday-mode .day-selector button.active {
            opacity: 1;
            background: #e68a2e;
            box-shadow: 0 1px 0 #a05e1e;
        }

        .phone-allowance {
            background: #fff2e4;
            border-radius: 22px;
            padding: 10px 16px;
            margin-bottom: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ffd8b5;
            font-weight: 600;
            gap: 6px;
        }
        .allowance-badge {
            font-size: 0.9rem;
            padding: 5px 14px;
            border-radius: 24px;
            background: #f0e0d0;
            color: #4f3827;
            white-space: nowrap;
        }
        .allowance-badge.good { background: #cfe8cf; color: #1f4f1f; }
        .allowance-badge.bad { background: #f8d7d7; color: #8b2e2e; }
        .rule-note {
            font-size: 0.82rem;
            color: #9b7a62;
            background: #fff6ef;
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-block;
            line-height: 1.4;
        }

        .task-grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 12px 0;
        }
        .task-item {
            background: #fffcf9;
            border-radius: 20px;
            padding: 14px 14px 10px 16px;
            box-shadow: 0 5px 0 #e2d1c2, 0 7px 14px -6px rgba(90, 60, 30, 0.12);
            border: 1px solid #f0e3d8;
            transition: opacity 0.15s;
            display: flex;
            flex-direction: column;
        }
        .task-item.completed {
            opacity: 0.65;
            box-shadow: 0 2px 0 #cbb9aa, 0 3px 6px -4px rgba(0, 0, 0, 0.1);
            background: #f5efe9;
        }
        .task-item.confiscated { border: 2px solid #e68a8a; background: #fff0f0; }

        .task-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 6px;
            flex-wrap: wrap;
        }
        .task-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #49372b;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .task-title input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #b47c52;
            cursor: pointer;
            transform: scale(1.05);
            flex-shrink: 0;
        }
        .counter-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #f7eee7;
            padding: 3px 7px;
            border-radius: 30px;
            border: 1px solid #ebd9cb;
            flex-shrink: 0;
        }
        .counter-badge button {
            width: 26px;
            height: 26px;
            border-radius: 16px;
            border: none;
            background: white;
            font-size: 1.1rem;
            font-weight: 700;
            color: #6b4d38;
            cursor: pointer;
            box-shadow: 0 2px 0 #cbb6a6;
            transition: 0.07s;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            border: 1px solid #e6d3c4;
            flex-shrink: 0;
        }
        .counter-badge button:active { transform: translateY(2px); box-shadow: 0 0px 0 #cbb6a6; }
        .counter-badge span {
            font-size: 1.1rem;
            font-weight: 700;
            min-width: 26px;
            text-align: center;
            color: #3c2d20;
        }

        .detail-list {
            list-style: none;
            padding-left: 2px;
            margin: 4px 0 6px;
            font-size: 0.85rem;
            color: #6a5543;
            flex: 1;
        }
        .detail-list li {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 7px;
            background: #f9f2eb;
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid #f1e2d6;
            position: relative;
            flex-wrap: wrap;
        }
        .detail-list li input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: #b47c52;
            cursor: pointer;
            flex-shrink: 0;
        }
        .detail-list li.completed-detail {
            text-decoration: line-through;
            opacity: 0.6;
            background: #eee7e0;
        }
        .detail-list li.detail-disabled {
            opacity: 0.4;
            pointer-events: none;
            background: #f0e8e0;
        }
        .detail-list li.detail-disabled input[type="checkbox"] { cursor: not-allowed; }

        .detail-text {
            flex: 1;
            outline: none;
            border-bottom: 1px dashed transparent;
            padding: 1px 2px;
            min-width: 40px;
            font-size: 0.85rem;
            line-height: 1.3;
            word-break: break-word;
        }
        .detail-text:focus {
            border-bottom-color: #b47c52;
            background: #fff6ee;
        }
        .delete-detail-btn {
            background: none;
            border: none;
            color: #c97a5a;
            font-size: 0.95rem;
            cursor: pointer;
            padding: 0 3px;
            opacity: 0.5;
            transition: 0.15s;
            line-height: 1;
            flex-shrink: 0;
        }
        .delete-detail-btn:hover { opacity: 1; transform: scale(1.2); }
        .add-detail-btn {
            background: #f0e4d8;
            border: none;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #6a4d36;
            cursor: pointer;
            margin-top: 2px;
            transition: 0.1s;
            border: 1px dashed #d4b8a4;
            width: 100%;
        }
        .add-detail-btn:hover { background: #e8d6c6; }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            padding-top: 6px;
            border-top: 1px dashed #ddcbbc;
            font-size: 0.8rem;
            font-weight: 600;
            color: #8b6d58;
            flex-wrap: wrap;
            gap: 4px;
        }
        .status-badge {
            background: #e4d4c6;
            padding: 2px 12px;
            border-radius: 20px;
            color: #4b3627;
            font-weight: 700;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .status-badge.done { background: #b9d8b3; color: #2d4a27; }
        .status-badge.confiscated { background: #f5c6c6; color: #8b2e2e; }

        .phone-rule-box {
            background: #f8f0e9;
            border-radius: 20px;
            padding: 10px 14px;
            margin-top: 6px;
            font-size: 0.85rem;
            color: #5b4433;
            border: 1px solid #eddccf;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .phone-rule-box .rule-text {
            flex: 1;
            min-width: 120px;
            outline: none;
            border-bottom: 1px dashed transparent;
            padding: 2px 4px;
            font-size: 0.85rem;
            word-break: break-word;
        }
        .phone-rule-box .rule-text:focus {
            border-bottom-color: #b47c52;
            background: #fff6ee;
        }
        .penalty-note {
            background: #fff0e0;
            border-left: 5px solid #e68a2e;
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 0.82rem;
            color: #7a4f28;
            margin: 8px 0;
            outline: none;
            border-bottom: 1px dashed transparent;
            line-height: 1.4;
        }
        .penalty-note:focus {
            border-bottom-color: #b47c52;
            background: #fff6ee;
        }
        .reset-child-btn {
            background: #f2e2d5;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            color: #5a3e2b;
            box-shadow: 0 4px 0 #b79b86;
            cursor: pointer;
            transition: 0.06s;
            font-size: 0.85rem;
            margin-top: 8px;
            width: 100%;
            border: 1px solid #ecd9c9;
            white-space: nowrap;
        }
        .reset-child-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b79b86; }

        .global-reset { text-align: center; margin-top: 16px; }
        .global-reset button {
            background: #6b4f3a;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 0 #3f2e20, 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: 0.08s;
            white-space: nowrap;
        }
        .global-reset button:active { transform: translateY(4px); box-shadow: 0 2px 0 #3f2e20; }

        .stats-panel {
            margin-top: 24px;
            background: #fffaf5;
            border-radius: 28px;
            padding: 18px 20px;
            border: 2px solid #f0e0d0;
            box-shadow: 0 8px 18px -8px rgba(0,0,0,0.1);
            max-width: 1500px;
            width: 100%;
        }
        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        .stats-header h3 {
            font-size: 1.4rem;
            color: #4d3626;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stats-clear-btn {
            background: #e8d6c8;
            border: none;
            padding: 7px 18px;
            border-radius: 24px;
            font-weight: 600;
            color: #4a3322;
            cursor: pointer;
            box-shadow: 0 2px 0 #b79b86;
            transition: 0.06s;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .stats-clear-btn:active { transform: translateY(2px); box-shadow: 0 0px 0 #b79b86; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .stats-child {
            background: #fffdfa;
            border-radius: 20px;
            padding: 14px 16px;
            border: 1px solid #f0e0d0;
        }
        .stats-child h4 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stats-child.doudou h4 { color: #b45f2b; }
        .stats-child.lele h4 { color: #2c5f8a; }

        .realtime-stats {
            background: #f3ece5;
            border-radius: 14px;
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 0.82rem;
            color: #4d3626;
            line-height: 1.6;
            border: 1px solid #e8d8ca;
            word-break: break-word;
        }
        .realtime-stats .rt-row {
            display: flex;
            justify-content: space-between;
            padding: 1px 0;
            flex-wrap: wrap;
            gap: 4px;
        }
        .realtime-stats .rt-label { font-weight: 600; color: #7a5a42; }
        .realtime-stats .rt-value { font-weight: 700; color: #3c2d20; }
        .realtime-stats .rt-value.good { color: #2d6b2d; }
        .realtime-stats .rt-value.bad { color: #b33a3a; }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.82rem;
            border-radius: 14px;
            background: #faf6f2;
            padding: 4px;
        }
        .history-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-bottom: 1px solid #eddfd3;
            flex-wrap: wrap;
            gap: 4px;
            color: #4b392b;
        }
        .history-entry:last-child { border-bottom: none; }
        .history-date {
            font-weight: 700;
            color: #7a5a42;
            min-width: 80px;
            font-size: 0.8rem;
        }
        .history-detail {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.78rem;
        }
        .history-detail span {
            background: #e9ddd2;
            padding: 1px 8px;
            border-radius: 16px;
        }
        .empty-history {
            color: #a58b77;
            text-align: center;
            padding: 16px;
            font-style: italic;
        }
        .stats-note {
            margin-top: 10px;
            font-size: 0.78rem;
            color: #8b6d58;
            text-align: right;
            background: #fff2e4;
            padding: 5px 14px;
            border-radius: 24px;
            display: inline-block;
        }

        .add-task-btn {
            background: #f0e4d8;
            border: 2px dashed #cbb096;
            padding: 8px 16px;
            border-radius: 24px;
            font-weight: 600;
            color: #6a4d36;
            cursor: pointer;
            margin-top: 6px;
            width: 100%;
            font-size: 0.85rem;
            transition: 0.1s;
        }
        .add-task-btn:hover { background: #e8d6c6; }
        .delete-task-btn {
            background: none;
            border: none;
            color: #c97a5a;
            font-size: 1rem;
            cursor: pointer;
            padding: 0 4px;
            opacity: 0.5;
            transition: 0.15s;
            line-height: 1;
            flex-shrink: 0;
        }
        .delete-task-btn:hover { opacity: 1; transform: scale(1.2); }
        .task-title-text {
            outline: none;
            border-bottom: 1px dashed transparent;
            padding: 1px 2px;
            min-width: 40px;
            word-break: break-word;
        }
        .task-title-text:focus {
            border-bottom-color: #b47c52;
            background: #fff6ee;
        }
        .task-hint {
            font-size: 0.72rem;
            color: #9b7a62;
            background: #fdf4ec;
            padding: 2px 8px;
            border-radius: 16px;
            margin-left: 2px;
            border: 1px solid #f0e0d0;
            white-space: nowrap;
        }
        .auto-note {
            font-size: 0.72rem;
            color: #9b7a62;
            background: #f0e8e0;
            padding: 3px 10px;
            border-radius: 16px;
            margin-top: 3px;
            display: inline-block;
        }
        .confiscated-note {
            background: #ffe0e0;
            border: 1px solid #f5b5b5;
            color: #8b2e2e;
            padding: 5px 10px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 5px;
            text-align: center;
        }

        @media (max-width: 750px) {
            body { padding: 10px; }
            .container { gap: 14px; }
            .sync-banner { padding: 8px 12px; border-radius: 16px; }
            .sync-status { font-size: 0.85rem; }
            .sync-info { font-size: 0.72rem; }
            .holiday-banner { padding: 10px 14px; border-radius: 20px; }
            .holiday-label { font-size: 0.95rem; }
            .holiday-status { font-size: 0.8rem; }
            .child-card { flex: 1 1 100%; padding: 16px 12px; border-radius: 26px; }
            .child-name { font-size: 1.6rem; }
            .child-avatar { font-size: 2rem; }
            .date-display { font-size: 0.72rem; padding: 3px 8px; }
            .day-selector button { padding: 5px 10px; font-size: 0.82rem; min-width: 30px; }
            .task-grid-2col { grid-template-columns: 1fr; gap: 10px; }
            .task-item { padding: 12px 12px 8px 14px; border-radius: 18px; }
            .task-title { font-size: 1rem; }
            .task-title input[type="checkbox"] { width: 18px; height: 18px; }
            .counter-badge button { width: 24px; height: 24px; font-size: 1rem; }
            .counter-badge span { font-size: 1rem; min-width: 22px; }
            .detail-list li { padding: 3px 7px; font-size: 0.8rem; }
            .detail-text { font-size: 0.8rem; }
            .status-badge { font-size: 0.75rem; padding: 2px 10px; }
            .phone-allowance { padding: 8px 12px; border-radius: 18px; }
            .allowance-badge { font-size: 0.82rem; padding: 4px 12px; }
            .rule-note { font-size: 0.78rem; padding: 4px 10px; }
            .phone-rule-box { padding: 8px 12px; border-radius: 16px; }
            .phone-rule-box .rule-text { font-size: 0.8rem; }
            .stats-panel { padding: 14px 12px; border-radius: 22px; margin-top: 16px; }
            .stats-header h3 { font-size: 1.2rem; }
            .stats-grid { grid-template-columns: 1fr; gap: 12px; }
            .stats-child { padding: 12px 12px; border-radius: 16px; }
            .realtime-stats { font-size: 0.78rem; padding: 6px 10px; }
            .history-list { max-height: 180px; font-size: 0.78rem; }

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ============================================================
// 🔧 請替換成你自己的 Firebase 設定
// ============================================================
const firebaseConfig = {
  apiKey: "有風險",
  authDomain: "mobile-28625.firebaseapp.com",
  databaseURL: "https://mobile-28625-default-rtdb.firebaseio.com",
  projectId: "mobile-28625",
  storageBucket: "mobile-28625.firebasestorage.app",
  messagingSenderId: "637375141823",
  appId: "1:637375141823:web:a67c8589374bce6787b30a",
  measurementId: "G-2HN3S1J4XD"
};
// ============================================================

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const DATA_REF = ref(db, 'checklist/data');
const HISTORY_REF = ref(db, 'checklist/history');
const META_REF = ref(db, 'checklist/meta');

// ============================================================
// 常數與預設資料
// ============================================================
const DEFAULT_TASKS = {
    doudou: [
        { id: 'homework', name: '📚 功課', details: [
            { id: 'hw1', text: '完成所有書寫' }, { id: 'hw2', text: '檢查改正' }, { id: 'hw3', text: '收拾書桌及書包' }
        ]},
        { id: 'chores', name: '🧹 家務', details: [
            { id: 'ch1', text: '整理房間' }, { id: 'ch2', text: '幫忙洗碗/垃圾' }, { id: 'ch3', text: '摺衣服' }
        ]},
        { id: 'revision', name: '📖 溫習', details: [
            { id: 'rv1', text: '按讀書計劃溫習' }, { id: 'rv_weekend', text: '📅 每科讀20分鐘(僅週末)' }, { id: 'rv3', text: '整理筆記/練習' }
        ]},
        { id: 'phone', name: '📱 手機時間', details: [
            { id: 'ph_confiscated', text: '🚫 有被沒收手機 (前提)' }, { id: 'ph1', text: '每30分停10分' }, { id: 'ph2', text: '完成條件才玩' }
        ]}
    ],
    lele: [
        { id: 'homework', name: '📚 功課', details: [
            { id: 'hw1', text: '完成所有書寫' }, { id: 'hw2', text: '檢查改正' }, { id: 'hw3', text: '收拾書桌及書包' }, { id: 'hw4', text: '🚫 做功課時不用手機' }
        ]},
        { id: 'chores', name: '🧹 家務', details: [
            { id: 'ch1', text: '整理房間' }, { id: 'ch2', text: '幫忙洗碗/垃圾' }, { id: 'ch3', text: '摺衣服' }
        ]},
        { id: 'revision', name: '📖 溫習', details: [
            { id: 'rv1', text: '按讀書計劃溫習' }, { id: 'rv_weekend', text: '📅 每科讀20分鐘(僅週末)' }, { id: 'rv3', text: '整理筆記/練習' }
        ]},
        { id: 'phone', name: '📱 手機時間', details: [
            { id: 'ph_confiscated', text: '🚫 有被沒收手機 (前提)' }, { id: 'ph1', text: '每20分停10分' }, { id: 'ph2', text: '完成條件才玩' }
        ]}
    ]
};
const DEFAULT_UI_TEXT = {
    doudou: { penaltyNote: '⚠️ 超過10:30睡 → 下週放學後交手機，9點才可用來做功課', dynamicRule: '📌 手機使用細則' },
    lele: { penaltyNote: '⚠️ 樂樂無懲罰規則；做功課時不能使用手機', dynamicRule: '📌 手機使用細則' }
};
const CONFISCATED_DETAIL_ID = 'ph_confiscated';
const WEEKEND_REVISION_ID = 'rv_weekend';

// ============================================================
// 工具函式
// ============================================================
function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }
function getTodayDay() { return new Date().getDay(); }
function formatDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}
function formatDisplayDate(date) {
    const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}年${m}月${d}日 (星期${dayNames[date.getDay()]})`;
}
function isCalendarWeekend(day) { return day === 6 || day === 0; }
function isWeekendStandard(day, holidayMode) { return holidayMode || isCalendarWeekend(day); }

// ============================================================
// 狀態
// ============================================================
let state = {
    doudou: { currentDay: getTodayDay(), tasks: [], counters: {}, mainChecked: {}, detailChecked: {}, uiText: { ...DEFAULT_UI_TEXT.doudou }, lastAutoDate: null },
    lele: { currentDay: getTodayDay(), tasks: [], counters: {}, mainChecked: {}, detailChecked: {}, uiText: { ...DEFAULT_UI_TEXT.lele }, lastAutoDate: null }
};
let globalHolidayMode = false;
let historyData = { doudou: [], lele: [] };
let isRemoteUpdate = false; // 標記是否來自遠端更新，避免無限迴圈
let lastPushTimestamp = 0;

function initDefaultState(child) {
    state[child].currentDay = getTodayDay();
    state[child].lastAutoDate = null;
    state[child].tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS[child]));
    state[child].counters = {};
    state[child].mainChecked = {};
    state[child].detailChecked = {};
    state[child].uiText = { ...DEFAULT_UI_TEXT[child] };
    state[child].tasks.forEach(task => {
        state[child].counters[task.id] = 0;
        state[child].mainChecked[task.id] = false;
        state[child].detailChecked[task.id] = {};
        task.details.forEach(d => { state[child].detailChecked[task.id][d.id] = false; });
    });
}

// ============================================================
// 同步狀態 UI
// ============================================================
function updateSyncStatus(status, info) {
    const dot = document.getElementById('syncDot');
    const text = document.getElementById('syncText');
    const infoEl = document.getElementById('syncInfo');
    if (!dot || !text) return;
    dot.className = 'sync-dot';
    if (status === 'offline') { dot.classList.add('offline'); text.textContent = '離線 · 使用本機資料'; }
    else if (status === 'syncing') { dot.classList.add('syncing'); text.textContent = '同步中…'; }
    else { text.textContent = '已連線 · 雲端即時同步'; }
    if (infoEl && info) infoEl.textContent = info;
}

// ============================================================
// 推送資料到 Firebase
// ============================================================
async function pushToCloud() {
    if (isRemoteUpdate) return; // 遠端更新時不推送，避免迴圈
    try {
        const now = Date.now();
        if (now - lastPushTimestamp < 300) return; // 節流
        lastPushTimestamp = now;

        updateSyncStatus('syncing', '上傳中…');
        const payload = {
            globalHolidayMode,
            doudou: state.doudou,
            lele: state.lele,
            updatedAt: now
        };
        await set(DATA_REF, payload);
        await set(HISTORY_REF, historyData);
        await set(META_REF, { updatedAt: now });
        updateSyncStatus('online', '最後更新：' + new Date(now).toLocaleTimeString());
    } catch (e) {
        console.error('雲端上傳失敗', e);
        updateSyncStatus('offline', '上傳失敗，稍後重試');
    }
}

// 節流版推送（用於高頻操作）
let pushTimer = null;
function pushToCloudDebounced() {
    if (isRemoteUpdate) return;
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(() => { pushToCloud(); }, 400);
}

// ============================================================
// 從 Firebase 接收即時更新
// ============================================================
function applyRemoteData(data, history) {
    isRemoteUpdate = true;
    try {
        if (data) {
            if (data.globalHolidayMode !== undefined) globalHolidayMode = data.globalHolidayMode;
            ['doudou', 'lele'].forEach(child => {
                if (data[child]) {
                    state[child].currentDay = data[child].currentDay ?? getTodayDay();
                    state[child].lastAutoDate = data[child].lastAutoDate ?? null;
                    state[child].tasks = data[child].tasks || JSON.parse(JSON.stringify(DEFAULT_TASKS[child]));
                    state[child].counters = data[child].counters || {};
                    state[child].mainChecked = data[child].mainChecked || {};
                    state[child].detailChecked = data[child].detailChecked || {};
                    state[child].uiText = data[child].uiText || { ...DEFAULT_UI_TEXT[child] };
                } else {
                    initDefaultState(child);
                }
                // 確保固定細項存在
                const phoneTask = state[child].tasks.find(t => t.id === 'phone');
                if (phoneTask && !phoneTask.details.some(d => d.id === CONFISCATED_DETAIL_ID)) {
                    phoneTask.details.unshift({ id: CONFISCATED_DETAIL_ID, text: '🚫 有被沒收手機 (前提)' });
                }
                const revTask = state[child].tasks.find(t => t.id === 'revision');
                if (revTask && !revTask.details.some(d => d.id === WEEKEND_REVISION_ID)) {
                    revTask.details.splice(1, 0, { id: WEEKEND_REVISION_ID, text: '📅 每科讀20分鐘(僅週末)' });
                }
                state[child].tasks.forEach(task => {
                    if (state[child].counters[task.id] === undefined) state[child].counters[task.id] = 0;
                    if (state[child].mainChecked[task.id] === undefined) state[child].mainChecked[task.id] = false;
                    if (!state[child].detailChecked[task.id]) state[child].detailChecked[task.id] = {};
                    task.details.forEach(d => {
                        if (state[child].detailChecked[task.id][d.id] === undefined) {
                            state[child].detailChecked[task.id][d.id] = false;
                        }
                    });
                });
            });
        }
        if (history) historyData = history;
        else if (!historyData.doudou) historyData = { doudou: [], lele: [] };

        // 重新計算計數器並套用到 UI
        recalcAllCounters();
        applyAllToUI();
        updateSyncStatus('online', '最後更新：' + new Date().toLocaleTimeString());
    } finally {
        isRemoteUpdate = false;
    }
}

function recalcAllCounters() {
    ['doudou', 'lele'].forEach(child => {
        recalcCountersFromDetails(child);
        const s = state[child];
        const req = getRequirements(child, s.currentDay);
        s.tasks.forEach(task => {
            if (req[task.id] > 0) {
                s.mainChecked[task.id] = (s.counters[task.id] || 0) >= req[task.id];
            }
        });
        if (isPhoneConfiscated(child)) s.mainChecked['phone'] = false;
    });
}

// 監聽 Firebase 資料變化
onValue(DATA_REF, (snapshot) => {
    const data = snapshot.val();
    if (data) {
        // 取得歷史資料（另外監聽）
        get(HISTORY_REF).then(histSnap => {
            const hist = histSnap.val();
            applyRemoteData(data, hist);
        }).catch(() => {
            applyRemoteData(data, null);
        });
    } else {
        // 雲端尚無資料，初始化並上傳
        ['doudou', 'lele'].forEach(child => initDefaultState(child));
        historyData = { doudou: [], lele: [] };
        recalcAllCounters();
        applyAllToUI();
        pushToCloud();
    }
});

onValue(HISTORY_REF, (snapshot) => {
    const hist = snapshot.val();
    if (hist) {
        historyData = hist;
        renderHistory();
    }
});

onValue(META_REF, (snapshot) => {
    const meta = snapshot.val();
    if (meta && meta.updatedAt) {
        updateSyncStatus('online', '雲端更新：' + new Date(meta.updatedAt).toLocaleTimeString());
    }
});

// ============================================================
// 需求與計數器
// ============================================================
function getRequirements(child, day) {
    const useWeekend = isWeekendStandard(day, globalHolidayMode);
    const base = { homework: 1, chores: useWeekend ? 3 : 1, revision: useWeekend ? 3 : 1, phone: 1 };
    const s = state[child];
    const req = {};
    s.tasks.forEach(task => { req[task.id] = (task.id in base) ? base[task.id] : 1; });
    return req;
}

function recalcCountersFromDetails(child) {
    const s = state[child];
    const useWeekend = isWeekendStandard(s.currentDay, globalHolidayMode);
    s.tasks.forEach(task => {
        let checkedCount = 0;
        task.details.forEach(d => {
            if (d.id === CONFISCATED_DETAIL_ID) return;
            if (d.id === WEEKEND_REVISION_ID && !useWeekend) return;
            if (s.detailChecked[task.id] && s.detailChecked[task.id][d.id]) checkedCount++;
        });
        s.counters[task.id] = checkedCount;
    });
}

function isPhoneConfiscated(child) {
    const s = state[child];
    return !!(s.detailChecked['phone'] && s.detailChecked['phone'][CONFISCATED_DETAIL_ID]);
}

// ============================================================
// 渲染（與之前相同，這裡省略部分細節，保持完整）
// ============================================================
function applyAllToUI() {
    // 假期模式
    const holidayCheckbox = document.getElementById('holidayModeCheckbox');
    if (holidayCheckbox) holidayCheckbox.checked = globalHolidayMode;
    const holidayStatus = document.getElementById('holidayStatus');
    if (holidayStatus) {
        holidayStatus.textContent = globalHolidayMode ? '已開啟' : '關閉';
        holidayStatus.className = globalHolidayMode ? 'holiday-status active' : 'holiday-status';
    }
    renderTasks('doudou');
    renderTasks('lele');
    updateChildUI('doudou');
    updateChildUI('lele');
    renderHistory();
}

function renderTasks(child) {
    const s = state[child];
    const container = document.getElementById(`${child}TasksContainer`);
    if (!container) return;
    const useWeekend = isWeekendStandard(s.currentDay, globalHolidayMode);
    container.classList.toggle('is-weekend', useWeekend);
    const addBtnHTML = `<button class="add-task-btn" data-child="${child}">＋ 新增任務</button>`;

    container.innerHTML = s.tasks.map(task => {
        const taskId = task.id;
        const isPhoneTask = (taskId === 'phone');
        const confiscated = isPhoneTask && isPhoneConfiscated(child);
        const visibleDetails = task.details.filter(d => {
            if (d.id === WEEKEND_REVISION_ID && !useWeekend) return false;
            return true;
        });
        const detailsHTML = visibleDetails.map(d => {
            const isConfiscatedDetail = (d.id === CONFISCATED_DETAIL_ID);
            const checked = !!(s.detailChecked[taskId] && s.detailChecked[taskId][d.id]);
            const disabled = (isPhoneTask && !isConfiscatedDetail && confiscated);
            return `<li data-detail-id="${d.id}" data-task-id="${taskId}" data-child="${child}" class="${checked ? 'completed-detail' : ''} ${disabled ? 'detail-disabled' : ''}">
                <input type="checkbox" class="detail-checkbox" data-detail-id="${d.id}" data-task-id="${taskId}" data-child="${child}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
                <span class="detail-text" contenteditable="true" data-detail-id="${d.id}" data-task-id="${taskId}" data-child="${child}">${d.text}</span>
                <button class="delete-detail-btn" data-detail-id="${d.id}" data-task-id="${taskId}" data-child="${child}">✕</button>
            </li>`;
        }).join('');
        let taskHint = '';
        if (taskId === 'chores') taskHint = useWeekend ? '<span class="task-hint">週末/假期需完成3項</span>' : '<span class="task-hint">平日需完成1項</span>';
        else if (taskId === 'revision') taskHint = useWeekend ? '<span class="task-hint">週末/假期每科20分鐘</span>' : '<span class="task-hint">按考試前讀書計劃</span>';
        const confiscatedNote = confiscated ? `<div class="confiscated-note">🚫 手機已被沒收，其他細項無法勾選</div>` : '';
        const statusClass = confiscated ? 'status-badge confiscated' : (s.mainChecked[taskId] ? 'status-badge done' : 'status-badge');
        const statusText = confiscated ? '已沒收' : (s.mainChecked[taskId] ? '完成' : '未完成');
        return `<div class="task-item ${s.mainChecked[taskId] && !confiscated ? 'completed' : ''} ${confiscated ? 'confiscated' : ''}" data-task-id="${taskId}" data-child="${child}">
            <div class="task-title-row">
                <div class="task-title">
                    <input type="checkbox" class="main-checkbox" data-task-id="${taskId}" data-child="${child}" ${s.mainChecked[taskId] ? 'checked' : ''} ${confiscated ? 'disabled' : ''}>
                    <span class="task-title-text" contenteditable="true" data-task-id="${taskId}" data-child="${child}">${task.name}</span>
                    <button class="delete-task-btn" data-task-id="${taskId}" data-child="${child}">✕</button>
                </div>
                <div class="counter-badge">
                    <button class="counter-btn" data-child="${child}" data-task="${taskId}" data-action="dec" ${confiscated ? 'disabled' : ''}>−</button>
                    <span id="${child}${capitalize(taskId)}Counter">${s.counters[taskId] || 0}</span>
                    <button class="counter-btn" data-child="${child}" data-task="${taskId}" data-action="inc" ${confiscated ? 'disabled' : ''}>+</button>
                </div>
            </div>
            ${taskHint ? `<div style="font-size:0.75rem;margin-bottom:3px;">${taskHint}</div>` : ''}
            ${confiscatedNote}
            <ul class="detail-list" id="${child}${capitalize(taskId)}Details">${detailsHTML}</ul>
            <button class="add-detail-btn" data-task-id="${taskId}" data-child="${child}">＋ 新增細項</button>
            <div class="status-row">
                <span>📌 需完成</span>
                <span class="${statusClass}" id="${child}${capitalize(taskId)}Status">${statusText} ${s.counters[taskId] || 0}/${getRequirements(child, s.currentDay)[taskId] || 1}</span>
            </div>
            <div class="auto-note">✅ 細項打勾自動計算</div>
        </div>`;
    }).join('') + addBtnHTML;
    bindTaskEvents(child);
}

function updateChildUI(child) {
    const s = state[child];
    const day = s.currentDay;
    const req = getRequirements(child, day);
    const useWeekend = isWeekendStandard(day, globalHolidayMode);
    const confiscated = isPhoneConfiscated(child);
    const dateEl = document.getElementById(`${child}DateDisplay`);
    if (dateEl) dateEl.textContent = formatDisplayDate(new Date());
    document.querySelectorAll(`#${child}DaySelector button`).forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.day) === day);
    });
    const card = document.querySelector(`.child-card.${child}`);
    if (card) card.classList.toggle('holiday-mode', globalHolidayMode);

    s.tasks.forEach(task => {
        const taskId = task.id;
        const isPhoneTask = (taskId === 'phone');
        const isConfiscated = isPhoneTask && confiscated;
        const counterEl = document.getElementById(`${child}${capitalize(taskId)}Counter`);
        if (counterEl) counterEl.textContent = s.counters[taskId] || 0;
        const mainEl = document.querySelector(`.main-checkbox[data-task-id="${taskId}"][data-child="${child}"]`);
        if (mainEl) { mainEl.checked = !!s.mainChecked[taskId]; mainEl.disabled = isConfiscated; }
        const statusEl = document.getElementById(`${child}${capitalize(taskId)}Status`);
        if (statusEl) {
            const need = req[taskId] || 1;
            if (isConfiscated) { statusEl.textContent = '已沒收'; statusEl.className = 'status-badge confiscated'; }
            else { statusEl.textContent = `${s.counters[taskId] || 0}/${need} ${s.mainChecked[taskId] ? '完成' : '未完成'}`; statusEl.className = s.mainChecked[taskId] ? 'status-badge done' : 'status-badge'; }
        }
        const cardItem = document.querySelector(`.task-item[data-task-id="${taskId}"][data-child="${child}"]`);
        if (cardItem) {
            cardItem.classList.toggle('completed', !!s.mainChecked[taskId] && !isConfiscated);
            cardItem.classList.toggle('confiscated', isConfiscated);
        }
        task.details.forEach(d => {
            if (d.id === WEEKEND_REVISION_ID && !useWeekend) return;
            const cb = document.querySelector(`.detail-checkbox[data-detail-id="${d.id}"][data-task-id="${taskId}"][data-child="${child}"]`);
            if (cb) {
                cb.checked = !!(s.detailChecked[taskId] && s.detailChecked[taskId][d.id]);
                const isConfiscatedDetail = (d.id === CONFISCATED_DETAIL_ID);
                const disabled = (isPhoneTask && !isConfiscatedDetail && isConfiscated);
                cb.disabled = disabled;
                const li = cb.closest('li');
                if (li) { li.classList.toggle('completed-detail', cb.checked); li.classList.toggle('detail-disabled', disabled); }
            }
        });
        document.querySelectorAll(`.counter-btn[data-task="${taskId}"][data-child="${child}"]`).forEach(btn => { btn.disabled = isConfiscated; });
    });

    const hwDone = s.mainChecked['homework'] || false;
    const choresDone = s.mainChecked['chores'] || false;
    const revisionDone = s.mainChecked['revision'] || false;
    let canUsePhone = false, phoneRuleText = '', dynamicText = '';
    if (confiscated) {
        canUsePhone = false;
        phoneRuleText = '🚫 手機已被沒收，今日不可使用';
        dynamicText = '📱 手機已被沒收，無法使用';
    } else if (child === 'doudou') {
        if (!useWeekend) {
            canUsePhone = hwDone && choresDone;
            phoneRuleText = canUsePhone ? '✅ 可玩手機至10:00 (每30分停10分)' : '❌ 需9:30前完成功課+家務才可玩手機至10:00';
            dynamicText = canUsePhone ? '📱 手機解鎖：10:00前，每30分鐘停10分鐘' : '⛔ 未完成功課/家務，手機不可用';
        } else {
            canUsePhone = hwDone && revisionDone;
            phoneRuleText = canUsePhone ? '✅ 可玩手機 (每30分停10分)' : '❌ 需完成功課及溫習才可玩手機';
            dynamicText = canUsePhone ? '📱 手機解鎖：每30分鐘停10分鐘' : '⛔ 未完成功課/溫習，手機不可用';
        }
    } else {
        if (!useWeekend) {
            canUsePhone = hwDone && choresDone;
            phoneRuleText = canUsePhone ? '✅ 可玩手機至9:30 (每20分停10分，做功課時不可用手機)' : '❌ 需9:00前完成功課+家務才可玩手機至9:30 (做功課時不可用手機)';
            dynamicText = canUsePhone ? '📱 手機解鎖：9:30前，每20分鐘停10分鐘；做功課時禁用' : '⛔ 未完成功課/家務，手機不可用；做功課時禁用';
        } else {
            canUsePhone = hwDone && revisionDone;
            phoneRuleText = canUsePhone ? '✅ 可玩手機 (每20分停10分，做功課時不可用手機)' : '❌ 需完成功課及溫習才可玩手機 (做功課時不可用手機)';
            dynamicText = canUsePhone ? '📱 手機解鎖：每20分鐘停10分鐘；做功課時禁用' : '⛔ 未完成功課/溫習，手機不可用；做功課時禁用';
        }
    }
    const phoneBadge = document.getElementById(`${child}PhoneBadge`);
    if (phoneBadge) { phoneBadge.className = canUsePhone ? 'allowance-badge good' : 'allowance-badge bad'; phoneBadge.textContent = canUsePhone ? '📱 手機可用' : (confiscated ? '📱 手機已沒收' : '📱 手機不可用'); }
    const phoneRule = document.getElementById(`${child}PhoneRule`);
    if (phoneRule) phoneRule.textContent = phoneRuleText;
    const penaltyEl = document.getElementById(`${child}PenaltyNote`);
    if (penaltyEl && penaltyEl.textContent !== s.uiText.penaltyNote) penaltyEl.textContent = s.uiText.penaltyNote;
    const dynamicEl = document.getElementById(`${child}DynamicRule`);
    if (dynamicEl && dynamicEl.textContent !== s.uiText.dynamicRule) dynamicEl.textContent = s.uiText.dynamicRule;
    updateRealtimeStats(child);
}

function updateRealtimeStats(child) {
    const s = state[child];
    const container = document.getElementById(`${child}RealtimeStats`);
    if (!container) return;
    const day = s.currentDay;
    const req = getRequirements(child, day);
    const dayNames = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    const useWeekend = isWeekendStandard(day, globalHolidayMode);
    const confiscated = isPhoneConfiscated(child);
    let html = `<div class="rt-row"><span class="rt-label">📅 當前設定</span><span class="rt-value">${dayNames[day]} ${useWeekend ? (globalHolidayMode ? '(假期模式)' : '(週末)') : '(平日)'}</span></div>`;
    s.tasks.forEach(task => {
        const taskId = task.id;
        const isConfiscated = taskId === 'phone' && confiscated;
        const done = !!s.mainChecked[taskId];
        const need = req[taskId] || 1;
        const count = s.counters[taskId] || 0;
        let statusText, cls;
        if (isConfiscated) { statusText = '🚫 已沒收'; cls = 'bad'; }
        else { statusText = done ? '✅ 完成' : (count >= need ? '🔄 待確認' : '⏳ 未完成'); cls = done ? 'good' : (count >= need ? '' : 'bad'); }
        html += `<div class="rt-row"><span class="rt-label">${task.name}</span><span class="rt-value ${cls}">${count}/${need} ${statusText}</span></div>`;
    });
    const hwDone = s.mainChecked['homework'] || false;
    const choresDone = s.mainChecked['chores'] || false;
    const revisionDone = s.mainChecked['revision'] || false;
    let canUsePhone = false;
    if (confiscated) canUsePhone = false;
    else if (child === 'doudou') canUsePhone = useWeekend ? (hwDone && revisionDone) : (hwDone && choresDone);
    else canUsePhone = useWeekend ? (hwDone && revisionDone) : (hwDone && choresDone);
    html += `<div class="rt-row" style="margin-top:5px;border-top:1px solid #e0d0c0;padding-top:5px;"><span class="rt-label">📱 手機使用</span><span class="rt-value ${canUsePhone ? 'good' : 'bad'}">${confiscated ? '🚫 已沒收' : (canUsePhone ? '✅ 可用' : '❌ 不可用')}</span></div>`;
    container.innerHTML = html;
}

// ============================================================
// 事件綁定
// ============================================================
function bindTaskEvents(child) {
    const container = document.getElementById(`${child}TasksContainer`);
    if (!container) return;
    container.querySelectorAll('.main-checkbox').forEach(cb => { cb.removeEventListener('change', handleMainCheckChange); cb.addEventListener('change', handleMainCheckChange); });
    container.querySelectorAll('.counter-btn').forEach(btn => { btn.removeEventListener('click', handleCounterClick); btn.addEventListener('click', handleCounterClick); });
    container.querySelectorAll('.detail-checkbox').forEach(cb => { cb.removeEventListener('change', handleDetailCheckChange); cb.addEventListener('change', handleDetailCheckChange); });
    container.querySelectorAll('.delete-detail-btn').forEach(btn => { btn.removeEventListener('click', handleDeleteDetail); btn.addEventListener('click', handleDeleteDetail); });
    container.querySelectorAll('.add-detail-btn').forEach(btn => { btn.removeEventListener('click', handleAddDetail); btn.addEventListener('click', handleAddDetail); });
    container.querySelectorAll('.delete-task-btn').forEach(btn => { btn.removeEventListener('click', handleDeleteTask); btn.addEventListener('click', handleDeleteTask); });
    container.querySelectorAll('.add-task-btn').forEach(btn => { btn.removeEventListener('click', handleAddTask); btn.addEventListener('click', handleAddTask); });
    container.querySelectorAll('.task-title-text').forEach(el => { el.removeEventListener('blur', handleTaskNameBlur); el.addEventListener('blur', handleTaskNameBlur); });
    container.querySelectorAll('.detail-text').forEach(el => { el.removeEventListener('blur', handleDetailTextBlur); el.addEventListener('blur', handleDetailTextBlur); });
}

function handleMainCheckChange(e) {
    const cb = e.target;
    const child = cb.dataset.child;
    const taskId = cb.dataset.taskId;
    state[child].mainChecked[taskId] = cb.checked;
    updateChildUI(child);
    pushToCloudDebounced();
}

function handleCounterClick(e) {
    const btn = e.currentTarget;
    const child = btn.dataset.child;
    const taskId = btn.dataset.task;
    const action = btn.dataset.action;
    if (!child || !taskId) return;
    const s = state[child];
    if (action === 'inc') s.counters[taskId] = (s.counters[taskId] || 0) + 1;
    else if (action === 'dec') s.counters[taskId] = Math.max(0, (s.counters[taskId] || 0) - 1);
    const req = getRequirements(child, s.currentDay)[taskId] || 1;
    if (req > 0) s.mainChecked[taskId] = (s.counters[taskId] || 0) >= req;
    updateChildUI(child);
    pushToCloudDebounced();
}

function handleDetailCheckChange(e) {
    const cb = e.target;
    const child = cb.dataset.child;
    const taskId = cb.dataset.taskId;
    const detailId = cb.dataset.detailId;
    if (!state[child].detailChecked[taskId]) state[child].detailChecked[taskId] = {};
    state[child].detailChecked[taskId][detailId] = cb.checked;
    if (taskId === 'phone' && detailId === CONFISCATED_DETAIL_ID && cb.checked) {
        const s = state[child];
        const phoneTask = s.tasks.find(t => t.id === 'phone');
        if (phoneTask) {
            phoneTask.details.forEach(d => { if (d.id !== CONFISCATED_DETAIL_ID) s.detailChecked['phone'][d.id] = false; });
            s.counters['phone'] = 0;
            s.mainChecked['phone'] = false;
        }
    }
    recalcCountersFromDetails(child);
    const s = state[child];
    const req = getRequirements(child, s.currentDay)[taskId] || 1;
    s.mainChecked[taskId] = (s.counters[taskId] || 0) >= req;
    if (taskId === 'phone' && cb.checked && detailId === CONFISCATED_DETAIL_ID) s.mainChecked['phone'] = false;
    renderTasks(child);
    updateChildUI(child);
    pushToCloudDebounced();
}

function handleDeleteDetail(e) {
    const btn = e.currentTarget;
    const child = btn.dataset.child;
    const taskId = btn.dataset.taskId;
    const detailId = btn.dataset.detailId;
    const s = state[child];
    const task = s.tasks.find(t => t.id === taskId);
    if (!task) return;
    if (detailId === CONFISCATED_DETAIL_ID) { alert('「有被沒收手機」是前提細項，不能刪除'); return; }
    if (detailId === WEEKEND_REVISION_ID) { alert('「每科讀20分鐘(僅週末)」是固定細項，不能刪除'); return; }
    task.details = task.details.filter(d => d.id !== detailId);
    if (s.detailChecked[taskId]) delete s.detailChecked[taskId][detailId];
    recalcCountersFromDetails(child);
    const req = getRequirements(child, s.currentDay)[taskId] || 1;
    s.mainChecked[taskId] = (s.counters[taskId] || 0) >= req;
    renderTasks(child);
    updateChildUI(child);
    pushToCloudDebounced();
}

function handleAddDetail(e) {
    const btn = e.currentTarget;
    const child = btn.dataset.child;
    const taskId = btn.dataset.taskId;
    const s = state[child];
    const task = s.tasks.find(t => t.id === taskId);
    if (!task) return;
    const newId = 'd' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
    task.details.push({ id: newId, text: '新細項' });
    if (!s.detailChecked[taskId]) s.detailChecked[taskId] = {};
    s.detailChecked[taskId][newId] = false;
    renderTasks(child);
    updateChildUI(child);
    pushToCloudDebounced();
}

function handleDeleteTask(e) {
    const btn = e.currentTarget;
    const child = btn.dataset.child;
    const taskId = btn.dataset.taskId;
    const s = state[child];
    if (s.tasks.length <= 1) { alert('至少需要保留一個任務'); return; }
    if (!confirm(`確定要刪除任務「${s.tasks.find(t => t.id === taskId)?.name || taskId}」嗎？`)) return;
    s.tasks = s.tasks.filter(t => t.id !== taskId);
    delete s.counters[taskId]; delete s.mainChecked[taskId]; delete s.detailChecked[taskId];
    renderTasks(child);
    updateChildUI(child);
    pushToCloudDebounced();
}

function handleAddTask(e) {
    const btn = e.currentTarget;
    const child = btn.dataset.child;
    const s = state[child];
    const newId = 'task' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
    const newTask = { id: newId, name: '✨ 新任務', details: [{ id: 'd1_' + newId, text: '細項一' }, { id: 'd2_' + newId, text: '細項二' }] };
    s.tasks.push(newTask);
    s.counters[newId] = 0; s.mainChecked[newId] = false; s.detailChecked[newId] = {};
    newTask.details.forEach(d => { s.detailChecked[newId][d.id] = false; });
    renderTasks(child);
    updateChildUI(child);
    pushToCloudDebounced();
}

function handleTaskNameBlur(e) {
    const el = e.currentTarget;
    const child = el.dataset.child;
    const taskId = el.dataset.taskId;
    const newName = el.textContent.trim() || '未命名任務';
    const s = state[child];
    const task = s.tasks.find(t => t.id === taskId);
    if (task) { task.name = newName; el.textContent = newName; updateChildUI(child); pushToCloudDebounced(); }
}

function handleDetailTextBlur(e) {
    const el = e.currentTarget;
    const child = el.dataset.child;
    const taskId = el.dataset.taskId;
    const detailId = el.dataset.detailId;
    const newText = el.textContent.trim() || '未命名細項';
    const s = state[child];
    const task = s.tasks.find(t => t.id === taskId);
    if (task) {
        const detail = task.details.find(d => d.id === detailId);
        if (detail) { detail.text = newText; el.textContent = newText; pushToCloudDebounced(); }
    }
}

function bindDaySelectors() {
    ['doudou', 'lele'].forEach(child => {
        const selector = document.getElementById(`${child}DaySelector`);
        if (selector) selector.querySelectorAll('button').forEach(btn => { btn.removeEventListener('click', handleDayClick); btn.addEventListener('click', handleDayClick); });
    });
}

function handleDayClick(e) {
    const btn = e.currentTarget;
    const child = btn.closest('.child-card').classList.contains('doudou') ? 'doudou' : 'lele';
    const day = parseInt(btn.dataset.day);
    state[child].currentDay = day;
    const s = state[child];
    const req = getRequirements(child, day);
    s.tasks.forEach(task => { if (req[task.id] > 0) s.mainChecked[task.id] = (s.counters[task.id] || 0) >= req[task.id]; });
    if (isPhoneConfiscated(child)) s.mainChecked['phone'] = false;
    recalcCountersFromDetails(child);
    renderTasks(child);
    updateChildUI(child);
    pushToCloudDebounced();
}

function handleHolidayModeChange(e) {
    globalHolidayMode = e.target.checked;
    const statusEl = document.getElementById('holidayStatus');
    if (statusEl) { statusEl.textContent = globalHolidayMode ? '已開啟' : '關閉'; statusEl.className = globalHolidayMode ? 'holiday-status active' : 'holiday-status'; }
    ['doudou', 'lele'].forEach(child => {
        const s = state[child];
        recalcCountersFromDetails(child);
        const req = getRequirements(child, s.currentDay);
        s.tasks.forEach(task => { if (req[task.id] > 0) s.mainChecked[task.id] = (s.counters[task.id] || 0) >= req[task.id]; });
        if (isPhoneConfiscated(child)) s.mainChecked['phone'] = false;
        renderTasks(child);
        updateChildUI(child);
    });
    pushToCloudDebounced();
}

function autoSelectDayBasedOnCalendar() {
    const todayDay = getTodayDay();
    const todayStr = formatDate(new Date());
    let changed = false;
    ['doudou', 'lele'].forEach(child => {
        const s = state[child];
        if (s.lastAutoDate !== todayStr) {
            s.currentDay = todayDay;
            s.lastAutoDate = todayStr;
            changed = true;
            const req = getRequirements(child, todayDay);
            s.tasks.forEach(task => { if (req[task.id] > 0) s.mainChecked[task.id] = (s.counters[task.id] || 0) >= req[task.id]; });
            if (isPhoneConfiscated(child)) s.mainChecked['phone'] = false;
            recalcCountersFromDetails(child);
        }
    });
    if (changed) {
        renderTasks('doudou'); renderTasks('lele');
        updateChildUI('doudou'); updateChildUI('lele');
        pushToCloudDebounced();
    }
}

function resetChild(child) {
    const s = state[child];
    s.tasks.forEach(task => {
        s.counters[task.id] = 0; s.mainChecked[task.id] = false;
        if (s.detailChecked[task.id]) Object.keys(s.detailChecked[task.id]).forEach(k => { s.detailChecked[task.id][k] = false; });
    });
    renderTasks(child); updateChildUI(child);
    pushToCloudDebounced();
}

function resetAll() {
    ['doudou', 'lele'].forEach(child => {
        state[child].currentDay = getTodayDay();
        state[child].lastAutoDate = formatDate(new Date());
        state[child].tasks.forEach(task => {
            state[child].counters[task.id] = 0; state[child].mainChecked[task.id] = false;
            if (state[child].detailChecked[task.id]) Object.keys(state[child].detailChecked[task.id]).forEach(k => { state[child].detailChecked[task.id][k] = false; });
        });
        renderTasks(child); updateChildUI(child);
    });
    pushToCloudDebounced();
}

function bindResetButtons() {
    document.querySelectorAll('.reset-child-btn').forEach(btn => { btn.removeEventListener('click', handleResetChild); btn.addEventListener('click', handleResetChild); });
    const globalBtn = document.getElementById('globalResetBtn');
    if (globalBtn) { globalBtn.removeEventListener('click', resetAll); globalBtn.addEventListener('click', resetAll); }
    const clearBtn = document.getElementById('clearStatsBtn');
    if (clearBtn) { clearBtn.removeEventListener('click', clearStats); clearBtn.addEventListener('click', clearStats); }
    const syncNowBtn = document.getElementById('syncNowBtn');
    if (syncNowBtn) { syncNowBtn.removeEventListener('click', () => pushToCloud()); syncNowBtn.addEventListener('click', () => pushToCloud()); }
}

function handleResetChild(e) {
    const child = e.currentTarget.dataset.child;
    if (child) resetChild(child);
}

function clearStats() {
    if (confirm('確定要清除所有統計記錄嗎？（不會影響任務設定）')) {
        historyData = { doudou: [], lele: [] };
        renderHistory();
        pushToCloudDebounced();
    }
}

function renderHistory() {
    ['doudou', 'lele'].forEach(child => {
        const container = document.getElementById(`${child}History`);
        if (!container) return;
        const entries = historyData[child] || [];
        if (entries.length === 0) { container.innerHTML = '<div class="empty-history">暫無記錄</div>'; return; }
        const recent = entries.slice(-20).reverse();
        container.innerHTML = recent.map(entry => {
            const dateStr = entry.date || '未知日期';
            const items = entry.items || {};
            const detailStr = Object.keys(items).map(k => items[k] ? `✅${k}` : `❌${k}`).join(' ');
            return `<div class="history-entry"><span class="history-date">${dateStr}</span><span class="history-detail"><span>${detailStr || '無資料'}</span></span></div>`;
        }).join('');
    });
}

function generateDailyRecord(child) {
    const s = state[child];
    const now = new Date();
    const dateStr = formatDate(now);
    const items = {};
    s.tasks.forEach(task => { items[task.name.replace(/[^\w\u4e00-\u9fa5]/g, '')] = s.mainChecked[task.id] ? true : false; });
    if (isPhoneConfiscated(child)) items['手機沒收'] = true;
    if (globalHolidayMode) items['假期模式'] = true;
    return { date: dateStr, timestamp: now.getTime(), items, counters: { ...s.counters }, day: s.currentDay };
}

function saveDailyStats() {
    ['doudou', 'lele'].forEach(child => {
        const record = generateDailyRecord(child);
        const list = historyData[child] || [];
        if (list.length > 0 && list[list.length - 1].date === record.date) list[list.length - 1] = record;
        else list.push(record);
        if (list.length > 90) historyData[child] = list.slice(-90);
        else historyData[child] = list;
    });
    renderHistory();
    pushToCloud();
}

function scheduleMidnightSave() {
    const now = new Date();
    const nextMidnight = new Date(now);
    nextMidnight.setHours(24, 0, 0, 0);
    const delay = nextMidnight - now;
    setTimeout(() => { saveDailyStats(); setInterval(saveDailyStats, 24 * 60 * 60 * 1000); }, delay);
}

function bindEditableText() {
    ['doudou', 'lele'].forEach(child => {
        const penaltyEl = document.getElementById(`${child}PenaltyNote`);
        if (penaltyEl) { penaltyEl.removeEventListener('blur', handlePenaltyBlur); penaltyEl.addEventListener('blur', handlePenaltyBlur); }
        const dynamicEl = document.getElementById(`${child}DynamicRule`);
        if (dynamicEl) { dynamicEl.removeEventListener('blur', handleDynamicBlur); dynamicEl.addEventListener('blur', handleDynamicBlur); }
    });
}

function handlePenaltyBlur(e) {
    const el = e.currentTarget;
    const child = el.id.startsWith('doudou') ? 'doudou' : 'lele';
    const text = el.textContent.trim();
    state[child].uiText.penaltyNote = text || DEFAULT_UI_TEXT[child].penaltyNote;
    pushToCloudDebounced();
}

function handleDynamicBlur(e) {
    const el = e.currentTarget;
    const child = el.id.startsWith('doudou') ? 'doudou' : 'lele';
    const text = el.textContent.trim();
    state[child].uiText.dynamicRule = text || DEFAULT_UI_TEXT[child].dynamicRule;
    pushToCloudDebounced();
}

function bindHolidayMode() {
    const checkbox = document.getElementById('holidayModeCheckbox');
    if (checkbox) { checkbox.checked = globalHolidayMode; checkbox.removeEventListener('change', handleHolidayModeChange); checkbox.addEventListener('change', handleHolidayModeChange); }
    const statusEl = document.getElementById('holidayStatus');
    if (statusEl) { statusEl.textContent = globalHolidayMode ? '已開啟' : '關閉'; statusEl.className = globalHolidayMode ? 'holiday-status active' : 'holiday-status'; }
}

// ============================================================
// 初始化
// ============================================================
function init() {
    // 先初始化預設狀態（雲端連線前先有東西顯示）
    ['doudou', 'lele'].forEach(child => initDefaultState(child));
    recalcAllCounters();
    applyAllToUI();

    bindDaySelectors();
    bindResetButtons();
    bindEditableText();
    bindHolidayMode();
    scheduleMidnightSave();

    setInterval(() => { autoSelectDayBasedOnCalendar(); }, 60000);

    updateSyncStatus('syncing', '連線中…');
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
